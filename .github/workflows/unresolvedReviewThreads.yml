name: 'Unresolved Review Threads'

on:
  pull_request_review_comment:
    types: [edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize, review_requested, review_request_removed]
    branches:
      - main_test  # 替换为你的目标分支名

jobs:
  unresolvedReviewThreads:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # 用于移除 PR 上的标签
      contents: write       # 某些情况下，解决审查线程也需要此权限
    steps:
      - uses: SamuelCabralCruz/unresolved-review-threads@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}